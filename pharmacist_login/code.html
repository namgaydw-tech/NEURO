<script>
(async () => {
  await Auth.ready();
  if (Auth.isSignedIn()) { Auth.redirectToIntended(); return; }
  if (Auth.isSignedIn()) { window.location.href = '../global_neural_dashboard_v1/code.html'; return; }

  // Mount Clerk SignIn
  if (window.clerkMounted) {
    const form = document.querySelector('form');
    if (form) form.style.display = 'none';
  }
})();

document.querySelector('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const inputs = e.target.querySelectorAll('input');
  const email = inputs[0].value;
  const password = inputs[1].value;
  try {
    await Auth.login(email, password);
    UI.toast('Access granted', 'success');
    setTimeout(() => window.location.href = '../global_neural_dashboard_v1/code.html', 800);
  } catch(err) {
    UI.toast('ACCESS DENIED: ' + err.message, 'error');
  }
});
</script>
